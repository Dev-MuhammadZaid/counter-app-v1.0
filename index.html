<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <h1>steps Counter App</h1>

        <button
            class="dark-button"
            type="button"
            aria-label="Switch to dark mode"
        >
            🌙
        </button>
    </header>

    <main>
        <section class="counter-wrap" aria-labelledby="counter-title">

            <h2 id="counter-title" class="count-digits">
                0
            </h2>

            <label
                class="steps-label"
                for="steps"
            >
                Step
            </label>

            <input
                id="steps"
                type="number"
                min="1"
                step="1"
                value="1"
                inputmode="numeric"
            >

            <div class="prim-buttons">
                <button
                    class="count-up"
                    type="button"
                >
                    Increase
                </button>

                <button
                    class="count-down"
                    type="button"
                >
                    Decrease
                </button>
            </div>

            <button
                class="count-reset"
                type="button"
            >
                Reset
            </button>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
